server:
  port: 8081

spring:
  application:
    name: producer
  cloud:
    function:
      definition: myMessageCreated
    stream:
      bindings:
        myMessageCreated-out-0:
          destination: my-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
  integration:
    poller:
      fixed-delay: 5000